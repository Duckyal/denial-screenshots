analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    todo: ignore
  exclude:
    - build/**

linter:
  rules:
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
